{% extends "base.html" %}

{% block title %}家計簿編集{% endblock %}

{% block content %}

<!-- 🌸 見出し（桜餅ピンク × かわいらしい） -->
<div class="text-center mb-4">
    <h1 style="color:#F7DDE7; font-weight:700;">
        🌸 家計簿編集
    </h1>
    <p style="color:#A27A85; font-size:14px;">
        内容を確認して、必要なら直してね。
    </p>
</div>

<!-- 🌸 白いカード（ふわっと影） -->
<div class="card p-4 shadow-sm" style="border-radius:14px;">

    <form action="/update/{{ id }}" method="post">

        <!-- user_id（変更不可なので hidden） -->
        <input type="hidden" name="user_id" value="{{ user_id }}">

        <!-- 日付 -->
        <div class="mb-3">
            <label class="form-label" style="color:#A27A85; font-weight:600;">日付</label>
            <input type="date" name="date" class="form-control"
                   value="{{ date }}" required style="border-radius:10px;">
        </div>

        <!-- 種別（収入 / 支出） ※表示のみ -->
        <div class="mb-3">
            <label class="form-label" style="color:#A27A85; font-weight:600;">種別</label>
            <input type="text" class="form-control" value="{{ selected_type }}"
                   readonly style="border-radius:10px; background:#f8f8f8;">
        </div>

        <!-- カテゴリ（type に応じて絞られた一覧） -->
        <div class="mb-3">
            <label class="form-label" style="color:#A27A85; font-weight:600;">カテゴリ</label>
            <select name="category_id" class="form-select" required style="border-radius:10px;">
                {% for cat in categories %}
                    <option value="{{ cat[0] }}"
                        {% if cat[0] == category_id %}selected{% endif %}>
                        {{ cat[1] }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- 金額 -->
        <div class="mb-3">
            <label class="form-label" style="color:#A27A85; font-weight:600;">金額</label>
            <input type="number" name="amount" class="form-control"
                   value="{{ amount }}" required style="border-radius:10px;">
        </div>

        <!-- メモ -->
        <div class="mb-3">
            <label class="form-label" style="color:#A27A85; font-weight:600;">メモ</label>
            <textarea name="memo" class="form-control" rows="2"
                      style="border-radius:10px;">{{ memo }}</textarea>
        </div>

        <!-- ボタン -->
        <div class="d-flex mt-3">
            <button type="submit" class="btn btn-primary me-2 px-4">更新する</button>
            <button type="button" class="btn btn-secondary" onclick="location.href='/list'">一覧へ戻る</button>
        </div>
    </form>

    <!-- 削除ボタン（優しいピンク系） -->
    <div class="d-flex justify-content-end mt-3">
        <form action="/delete/{{ id }}" method="post"
              onsubmit="return confirm('本当に削除しますか？');">
            <button type="submit" class="btn btn-danger px-4">削除する</button>
        </form>
    </div>

</div>

{% endblock %}
