{% extends "base.html" %}

{% block title %}家計簿編集{% endblock %}

{% block content %}
<h1 class="mb-4">家計簿編集</h1>

<div class="card p-4 shadow-sm">

    <form action="/update/{{ row[0] }}" method="post">

        <div class="mb-3">
            <label class="form-label">日付：</label>
            <input type="date" name="date" class="form-control" value="{{ row[1] }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">カテゴリ：</label>
            <select name="category" class="form-select" required>
                {% for cat in categories %}
                    <option value="{{ cat[1] }}"
                        {% if cat[1] == row[2] %}selected{% endif %}>
                        {{ cat[1] }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">金額：</label>
            <input type="number" name="amount" class="form-control" value="{{ row[3] }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">入／出</label>
            <select name="type" class="form-select" required>
                <option value="支出" {% if row[4] == '支出' %}selected{% endif %}>支出</option>
                <option value="収入" {% if row[4] == '収入' %}selected{% endif %}>収入</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">メモ：</label>
            <textarea name="memo" class="form-control" rows="2">{{ row[5] }}</textarea>
        </div>

        <div class="d-flex mt-3">
            <button type="submit" class="btn btn-primary me-2">更新する</button>
            <button type="button" class="btn btn-secondary" onclick="location.href='/list'">一覧へ戻る</button>
        </div>
    </form>

    <div class="d-flex justify-content-end mt-3">
        <form action="/delete/{{ row[0] }}" method="post"
            onsubmit="return confirm('本当に削除しますか？');" class="mt-3">
            <button type="submit" class="btn btn-danger">削除する</button>
        </form>
    </div>

</div>
{% endblock %}
