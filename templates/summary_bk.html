<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>月別集計結果</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    </head>
    <body class="bg-light">

            <div class="container mt-5">

            <h1 class="mb-4">{{ year }}年{{ month }}月の集計</h1>

            <div class="card p-4 shadow-sm">

                <table class="table table-bordered">
                    <tbody>
                        <tr>
                            <th class="table-dark">支出合計</th>
                            <td>{{ expense_total }} 円</td>
                        </tr>
                        <tr>
                            <th class="table-dark">収入合計</th>
                            <td>{{ income_total }} 円</td>
                        </tr>
                        <tr>
                            <th class="table-dark">差額（収支）</th>
                            <td>{{ balance }} 円</td>
                        </tr>
                    </tbody>
                </table>

                <div class="d-frex mt-3">
                    <button type="button" class="btn btn-secondary me-2" onclick="location.href='/select-month'">年月を選び直す</button>
                    <button type="button" class="btn btn-info" onclick="location.href='/list'">一覧へ戻る</button>
                </div>
            </div>
        </div>
    </body>
</html>
