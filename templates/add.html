{% extends "base.html" %}

{% block title %}家計簿入力{% endblock %}

{% block content %}

<!-- 🌸 見出し（桜餅ピンク × かわいらしい） -->
<div class="text-center mb-4">
    <h1 style="color:#e797c3; font-weight:700; display:flex; align-items:center; gap:6px; justify-content:center;">
    <span class="page-icon icon-violet"></span>
    家計簿入力
    </h1>

    <!-- <h1 style="color:#F7DDE7; font-weight:700;">
        🌸 家計簿入力
    </h1> -->
    <p style="color:#A27A85; font-size:14px;">
        今日の記録をつけておこうね。
    </p>
</div>

<!-- 🌸 白いカード（ふわっと影） -->
<form action="/add" method="post" class="card p-4 shadow-sm" style="border-radius:14px;">

    <!-- ユーザ -->
    <div class="mb-3">
        <label class="form-label" style="color:#A27A85; font-weight:600;">人別</label>
        <select name="user_id" class="form-control"
                onchange="location.href='/add?user_id=' + this.value;"
                style="border-radius:10px;">
                <option value="">選択してください</option>
                {% for user in users %}
                    <option value="{{ user[0] }}"
                        {% if selected_user_id == user[0]|string %}selected{% endif %}>
                        {{ user[1] }}
                    </option>
                {% endfor %}
        </select>
    </div>

    <!-- 日付 -->
    <div class="mb-3">
        <label class="form-label" style="color:#A27A85; font-weight:600;">日付</label>
        <input type="date" name="date" class="form-control" required style="border-radius:10px;">
    </div>

    <!-- カテゴリ -->
    <div class="mb-3">
        <label class="form-label" style="color:#A27A85; font-weight:600;">カテゴリ</label>
        <select name="category_id" class="form-select" required style="border-radius:10px;">
            <option value="">選択してください</option>
            {% for cat in categories %}
                <option value="{{ cat[0] }}">{{ cat[1] }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- 金額 -->
    <div class="mb-3">
        <label class="form-label" style="color:#A27A85; font-weight:600;">金額</label>
        <input type="number" name="amount" class="form-control" placeholder="例：1200" required style="border-radius:10px;">
    </div>

    <!-- 入／出 -->
    <div class="mb-3">
        <label class="form-label" style="color:#A27A85; font-weight:600;">入／出</label>
        <select name="type" class="form-select" required style="border-radius:10px;">
            <option value="支出">支出</option>
            <option value="収入">収入</option>
        </select>
    </div>

    <!-- メモ -->
    <div class="mb-3">
        <label class="form-label" style="color:#A27A85; font-weight:600;">メモ</label>
        <textarea name="memo" class="form-control" rows="2" placeholder="任意で入力" style="border-radius:10px;"></textarea>
    </div>

    <!-- ボタン -->
    <div class="d-flex mt-3">
        <button type="submit" class="btn btn-primary me-2 px-4">登録する</button>
        <button type="button" class="btn btn-secondary" onclick="location.href='/list'">一覧へ戻る</button>
    </div>

</form>

{% endblock %}
