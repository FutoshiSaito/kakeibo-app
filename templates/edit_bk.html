<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>家計簿編集</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <h1 class="mb-4">家計簿編集</h1>

            <form action="/update/{{ row[0] }}" method="post" class="card p-4 shadow-sm">

                <div class="mb-3">
                    <label class="form-label">日付：</label>
                    <input type="date" name="date" class="form-control" value="{{ row[1] }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">カテゴリ：</label>
                    <input type="text" name="category" class="form-control" value="{{ row[2] }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">金額：</label>
                    <input type="number" name="amount" class="form-control" value="{{ row[3] }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">種類：</label>
                    <select name="type" class="form-select" required>
                        <option value="expense" {% if row[4] == 'expense' %}selected{% endif %}>支出</option>
                        <option value="income" {% if row[4] == 'income' %}selected{% endif %}>収入</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">メモ：</label>
                    <textarea name="memo" class="form-control" rows="2">{{ row[5] }}</textarea>
                </div>

                <div class="d-flex mt-3">
                    <button type="submit" class="btn btn-primary me-2">更新する</button>
                    <button type="button" class="btn btn-secondary" onclick="location.href='/list'">一覧へ戻る</button>
                </div>
            </form>
        </div>
    </body>
</html>
