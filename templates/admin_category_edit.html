{% extends "base.html" %}
{% block title %}カテゴリ編集{% endblock %}

{% block content %}

<div class="text-center mb-4">
    <h1 style="color:#e797c3; font-weight:700;">
        🗂️ カテゴリ編集
    </h1>
    <p style="color:#A27A85; font-size:14px;">
        カテゴリの内容を変更できるよ。
    </p>
</div>

<div class="card p-4 shadow-sm" style="border-radius:14px; max-width:500px; margin:auto;">

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form action="/admin/categories/edit/{{ category.id }}" method="post">

        <!-- カテゴリ名 -->
        <div class="mb-3">
            <label class="form-label" style="color:#A27A85; font-weight:600;">
                カテゴリ名
            </label>
            <input type="text" name="name" class="form-control"
                   value="{{ category.name }}"
                   required style="border-radius:10px;">
        </div>

        <!-- 種別 -->
        <div class="mb-3">
            <label class="form-label" style="color:#A27A85; font-weight:600;">
                種別
            </label>
            <select name="type" class="form-control" style="border-radius:10px;">
                <option value="支出" {% if category.type == "支出" %}selected{% endif %}>支出</option>
                <option value="収入" {% if category.type == "収入" %}selected{% endif %}>収入</option>
            </select>
        </div>

        <button class="btn btn-primary w-100 mt-3">更新する</button>
    </form>

    <!-- 削除ボタン -->
    <form action="/admin/categories/delete/{{ category.id }}" method="post"
          onsubmit="return confirm('本当に削除しますか？');">
        <button class="btn btn-danger w-100 mt-3">削除する</button>
    </form>

    <a href="/admin" class="btn btn-outline-secondary w-100 mt-3">戻る</a>

</div>

{% endblock %}
