{% extends "base.html" %}

{% block title %}家計簿一覧{% endblock %}

{% block content %}
<h1 class="mb-4">家計簿一覧</h1>

<div class="card shadow-sm p-4">
    <form method="get" action="/list" class="mb-3">
        <div class="input-group" style="width: 260px;">
            <select name="user_id" class="form-select" style="width: 200px; display: inline-block;">
                <option value="">全ユーザ</option>
                {% for user in users %}
                    <option value="{{ user.id }}"
                    {% if selected_user == user.id|string %}selected{% endif %}>
                    {{ user.username }}
                    </option>
                {% endfor %}
            </select>
            <button class="btn btn-primary" type="submit">表示</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-borderd">
            <thead class="table-dark">
                <tr>
                    <th>日付</th>
                    <th>ユーザー</th>
                    <th>入／出</th>
                    <th>金額</th>
                    <th>カテゴリ</th>
                    <th>メモ</th>
                    <th>編集</th>
                </tr>
            </thead>

            <tbody>
                {% for row in rows %}
                    <tr>
                        <td>{{ row.date }}</td>
                        <td>{{ row.username or ''}}</td>
                        <td>{{ row.type }}</td>
                        <td class="text-end">{{ "{:,}".format(row.amount) }}</td>
                        <td>{{ row.category_name }}</td>
                        <td>{{ row.memo }}</td>
                        <td><a href="/edit/{{ row.id }}">編集</a></td>
                    </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="d-flex mt-3">
        <button type="button" class="btn btn-secondary me-2" onclick="location.href='/'">入力画面に戻る</button>
        <button type="button" class="btn btn-info" onclick="location.href='/select-month'">月別集計を見る</button>
    </div>
</div>
{% endblock %}
