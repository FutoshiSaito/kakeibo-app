{% extends "base.html" %}
{% block title %}カテゴリ一覧{% endblock %}

{% block content %}

<!-- 🪻 見出し（ラベンダー × かわいらしい） -->
<div class="text-center mb-4">
    <h1 style="color:#e797c3; font-weight:700;">
        🪻 種別の一覧
    </h1>
    <p style="color:#A27A85; font-size:14px;">
        種別の管理ができるよ。
    </p>
</div>

<!-- 🌸 白いカード（ふわっと影） -->
<div class="card shadow-sm p-4" style="border-radius:14px;">

    <!-- 追加ボタン（桜餅ピンク） -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/add-category" class="btn btn-primary px-3">＋ カテゴリを追加</a>
    </div>

    <!-- テーブル（淡い桜色ヘッダー） -->
    <table class="table table-hover align-middle">
        <thead style="background-color:#FCEFF4; color:#A27A85;">
            <tr>
                <th>カテゴリ名</th>
                <th>人別</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            {% for cat in categories %}
            <tr>
                <td>{{ cat[1] }}</td>
                <td>
                    {% if cat[2] %}
                        {{ cat[2] }}
                    {% else %}
                        共通
                    {% endif %}
                </td>
                <td>
                    <a href="/delete-category/{{ cat[0] }}"
                       class="btn btn-danger btn-sm px-3"
                       onclick="return confirm('本当に削除しますか？');">
                       削除
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}
