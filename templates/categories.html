{% extends "base.html" %}
{% block title %}カテゴリ一覧{% endblock %}

{% block content %}
<h1 class="mb-4">カテゴリ一覧</h1>

<div class="card shadow-sm p-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/add-category" class="btn btn-primary">カテゴリを追加</a>
    </div>

    <table class="table table-striped">
        <thead class="table-dark">
            <tr>
                <th>カテゴリ名</th>
                <th>ユーザー</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for cat in categories %}
            <tr>
                <td>{{ cat[1] }}</td>
                <td>
                    {% if cat[2] %}
                        {{ cat[2] }}
                    {% else %}
                        共通
                    {% endif %}
                </td>
                <td>
                    <a href="/delete-category/{{ cat[0] }}" 
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('本当に削除しますか？');">
                       削除
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
