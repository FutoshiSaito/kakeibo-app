<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}家計簿アプリ{% endblock %}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>

        /* ------------------------------
        🌸 カラーパレット
        ------------------------------ */

        /* 背景：ほんのり桜色 */
        body {
            background-color: #FCEFF4;
            font-family: "Noto Sans JP", sans-serif;
        }

        /* カード：白＋柔らかい影 */
        .card {
            background-color: #FFFFFF;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border: none;
        }

        /* 見出し：桜餅ピンク */
        h1, h2, h3 {
            color: #F7DDE7;
            font-weight: 600;
        }

        /* ------------------------------
        🌸 ボタン
        ------------------------------ */

        /* メインボタン（桜餅ピンク） */
        .btn-primary {
            background-color: #F7DDE7;
            border-color: #F7DDE7;
            color: #7A4F5A; /* 少し落ち着いたピンクブラウン */
            font-weight: 600;
            border-radius: 10px;
        }

        .btn-primary:hover {
            background-color: #F4C9D9;
            border-color: #F4C9D9;
        }

        /* セカンダリーボタン（白 × 桜色） */
        .btn-secondary {
            background-color: #FFFFFF;
            border: 2px solid #F7DDE7;
            color: #7A4F5A;
            font-weight: 600;
            border-radius: 10px;
        }

        .btn-secondary:hover {
            background-color: #FCEFF4;
        }

        /* 削除ボタンも優しい色に */
        .btn-danger {
            background-color: #F2A7B8;
            border-color: #F2A7B8;
            border-radius: 10px;
        }

        .btn-danger:hover {
            background-color: #E98FA4;
        }

        /* ------------------------------
        🌸 入力フォーム
        ------------------------------ */

        .form-control, .form-select, textarea {
            border-radius: 10px;
            border: 1px solid #F7DDE7;
        }

        .form-control:focus, .form-select:focus, textarea:focus {
            border-color: #F4C9D9;
            box-shadow: 0 0 0 0.2rem rgba(247, 221, 231, 0.4);
        }

        /* ------------------------------
        🌿 自然素材のアクセント
        ------------------------------ */

        hr {
            border: none;
            border-top: 1px solid #E8E2D0; /* 麻布のようなベージュ */
            margin: 1.5rem 0;
        }

        /* ------------------------------
        🐾 さりげない猫の足跡
        ------------------------------ */

        body::after {
            content: "🐾";
            position: fixed;
            bottom: 12px;
            right: 12px;
            opacity: 0.25;
            font-size: 22px;
            pointer-events: none;
        }

        /* 花アイコンの共通スタイル */
        .page-icon {
            width: 70px;   /* ← 少し大きめにした */
            height: 70px;
            display: inline-block;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.95; /* ← 少し濃くして存在感UP */
            transform: translateY(-6px) rotate(180deg); /* ← これで下に6pxずらす */
        }

        .icon-violet {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="%238A7CC5" stroke-width="0.8" fill="none"><path d="M12 3 C8 4, 10 7, 12 9 C14 7, 16 4, 12 3Z" fill="%238A7CC5"/><path d="M7 6 C8 5, 11 6, 12 9 C10 10, 7 9, 7 6Z" fill="%238A7CC5"/><path d="M12 9 C13 6, 16 5, 17 6 C17 9, 14 10, 12 9Z" fill="%238A7CC5"/><path d="M8 13 C7 11, 10 9, 12 10 C13 12, 10 14, 8 13Z" fill="%238A7CC5"/><path d="M12 10 C14 9, 17 11, 16 13 C14 14, 11 12, 12 10Z" fill="%238A7CC5"/><circle cx="12" cy="9" r="1.8" fill="%23E2DFF1"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
        }
        </style>
    </head>

    <body class="bg-light">
        <nav class="navbar navbar-expand-lg" 
            style="background-color:#FFFFFF; border-bottom: 3px solid #F7DDE7;">
            <div class="container">

                <!-- ロゴ（桜餅ピンク） -->
                <a class="navbar-brand" href="/" 
                style="color:#7A4F5A; font-weight:700; font-size:20px;">
                    ☘️ 家計簿
                </a>

                <!-- メニュー -->
                <div>
                    <a class="btn btn-secondary btn-sm me-2" href="/add">入力</a>
                    <a class="btn btn-secondary btn-sm me-2" href="/list">一覧</a>
                    <a class="btn btn-secondary btn-sm me-2" href="/select-month">月別集計</a>
                    <a class="btn btn-secondary btn-sm me-2" href="/add-user">人の登録</a>
                    <a class="btn btn-secondary btn-sm" href="/categories">種別管理</a>
                </div>

            </div>
        </nav>

        <div class="container mt-4">

            <h1 class="page-title" style="display:flex; align-items:center; gap:6px;">
                {% block page_icon %}{% endblock %}
                {% block page_title %}{% endblock %}
            </h1>

            {% block content %}
            {% endblock %}
        </div>
    </body>
</html>
