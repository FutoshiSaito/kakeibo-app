<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>家計簿一覧</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="bg-light">
        <div class="container mt-4">
            <h1>家計簿一覧</h1>

            <div class="card shadow-sm p-4">
                <table class="table table-striped table-borderd">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>日付</th>
                            <th>カテゴリ</th>
                            <th>金額</th>
                            <th>種類</th>
                            <th>メモ</th>
                            <th>編集</th>
                            <th>削除</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for row in rows %}
                            <tr>
                                <td>{{ row[0] }}</td>
                                <td>{{ row[1] }}</td>
                                <td>{{ row[2] }}</td>
                                <td>{{ row[3] }}</td>
                                <td>{{ row[4] }}</td>
                                <td>{{ row[5] }}</td>
                                <td><a href="/edit/{{ row[0] }}">編集</a></td>
                                <td><a href="/delete/{{ row[0] }}">削除</a></td>
                            </tr>
                    {% endfor %}
                    </tbody>
                </table>

                <div class="d-flex mt-3">
                    <button type="button" class="btn btn-secondary me-2" onclick="location.href='/'">入力画面に戻る</button>
                    <button type="button" class="btn btn-info" onclick="location.href='/select-month'">月別集計を見る</button>
                </div>
            </div>
        </div>
    </body>
</html>
