{% extends "base.html" %}
{% block title %}決済手段編集{% endblock %}

{% block content %}

<div class="text-center mb-4">
    <h1 style="color:#e797c3; font-weight:700;">
        💳 決済手段の編集
    </h1>
    <p style="color:#A27A85; font-size:14px;">
        決済手段の内容を変更できるよ。
    </p>
</div>

<div class="card p-4 shadow-sm" style="border-radius:14px; max-width:500px; margin:auto;">

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form action="/admin/payments/edit/{{ payment.id }}" method="post">

        <!-- 決済手段名 -->
        <div class="mb-3">
            <label class="form-label" style="color:#A27A85; font-weight:600;">
                決済手段名
            </label>
            <input type="text" name="name" class="form-control"
                   value="{{ payment.name }}"
                   required style="border-radius:10px;">
        </div>

        <!-- 並び順 -->
        <div class="mb-3">
            <label class="form-label" style="color:#A27A85; font-weight:600;">
                並び順（任意）
            </label>
            <input type="number" name="sort_order" class="form-control"
                   value="{{ payment.sort_order if payment.sort_order else '' }}"
                   style="border-radius:10px;">
        </div>

        <button class="btn btn-primary w-100 mt-3">更新する</button>
    </form>

    <!-- 削除ボタン -->
    <form action="/admin/payments/delete/{{ payment.id }}" method="post"
          onsubmit="return confirm('本当に削除しますか？');">
        <button class="btn btn-danger w-100 mt-3">削除する</button>
    </form>

    <a href="/admin" class="btn btn-outline-secondary w-100 mt-3">戻る</a>

</div>

{% endblock %}
