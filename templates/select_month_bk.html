<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>月別集計</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <h1 class="mb-4">月別集計</h1>

            <div class="card p-4 shadow-sm">

                <form action="/select-month" method="post">
                    <div class="mb-3">
                        <label class="form-label">年月を選択</label>
                        <input type="month" name="ym" class="form-control" required>
                    </div>
                    
                    <div class="d-flex mt-3">
                        <button type="submit" class="btn btn-primary me-2">集計する</button>
                        <button type="button" class="btn btn-secondary" onclick="location.href='/list'">一覧へ戻る</button>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
