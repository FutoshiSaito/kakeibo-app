{% extends "base.html" %}

{% block titel %}家計簿入力{% endblock %}

{% block content %}
<h1 class="mb-4">家計簿入力</h1>
<form action="/add" method="post" class="card p-4 shadow-sm">

    <div class="mb-3">
        <label class="form-label">ユーザ</label>
        <select name="user_id" class="form-control">
            {% for user in users %}
                <option value="{{ user[0] }}">{{ user[1] }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">日付</label>
        <input type="date" name="date" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">カテゴリ</label>
        <input type="text" name="category" class="form-control" placeholder="例：食費、交通費" required>
    </div>

    <div class="mb-3">
        <label class="form-label">金額</label>
        <input type="number" name="amount" class="form-control" placeholder="例：1200" required>
    </div>

    <div class="mb-3">
        <label class="form-label">入／出</label>
        <select name="type" class="form-select" required>
            <option value="支出">支出</option>
            <option value="収入">収入</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">メモ</label>
        <textarea type="text" name="memo" class="form-control" rows="2" placeholder="任意で入力"></textarea>
    </div>

    <div class="d-flex mt-3">
        <button type="submit" class="btn btn-primary me-2">登録する</button>
        <button type="button" class="btn btn-secondary" onclick="location.href='/list'">一覧へ戻る</button>
    </div>
</form>
{% endblock %}
