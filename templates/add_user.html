{% extends "base.html" %}

{% block title %}ユーザー登録{% endblock %}

{% block content %}

<!-- 🌸 見出し（桜餅ピンク × かわいらしい） -->
<div class="text-center mb-4">
    <h1 style="color:#F7DDE7; font-weight:700;">
        🌸 ユーザー登録
    </h1>
    <p style="color:#A27A85; font-size:14px;">
        新しい家族を追加できるよ。
    </p>
</div>

<!-- 🌸 白いカード（ふわっと影） -->
<div class="card p-4 shadow-sm" style="border-radius:14px;">

    <form action="/add-user" method="post">

        <!-- ユーザー名 -->
        <div class="mb-3">
            <label class="form-label" style="color:#A27A85; font-weight:600;">
                ユーザー名
            </label>
            <input type="text" name="username" class="form-control"
                   required style="border-radius:10px;">
        </div>

        <!-- ボタン -->
        <div class="mt-3 d-flex">
            <button type="submit" class="btn btn-primary me-2 px-4">登録する</button>
            <button type="button" class="btn btn-secondary"
                    onclick="location.href='/'">戻る</button>
        </div>

    </form>

</div>

{% endblock %}
